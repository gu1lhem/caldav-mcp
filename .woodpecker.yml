steps:
  check:
    image: denoland/deno:2.9.7@sha256:fa335acdf6b72106eda2cb6a8cb5f4187e7630e357467489db4b2e7352d5e432
    commands:
      # --frozen: fail when deno.lock and deno.jsonc disagree, instead of resolving afresh. The
      # test run needs its own flag: the tests import modules that `deno install` does not reach.
      - deno install --frozen
      - deno task check
      - deno task test --frozen
      - deno publish --dry-run

  # Builds the Docker image for both platforms on every pull request and pushes nothing, so a
  # change that breaks the Dockerfile fails here instead of at the next release. kaniko builds in
  # user space inside an ordinary container: no Docker daemon, no volume, no privileged mode, no
  # secret. The Dockerfile cross-compiles, so the arm64 build needs no emulation. kaniko ignores
  # the builder stage's `--platform`, so BUILDER names the builder image's amd64 digest (this CI's
  # agents are amd64); keep it in step with the Dockerfile's default. One kaniko run per step:
  # kaniko rewrites its own container's file system while it builds.
  image-build-amd64:
    image: martizih/kaniko:v1.28.5-alpine@sha256:6ba327d49f75147a44e39e8a977e9cde11b483832214b307ccf11f9da360693c
    when:
      event: pull_request
    commands:
      - /kaniko/executor --context "$$CI_WORKSPACE" --dockerfile Dockerfile
        --build-arg "BUILDER=denoland/deno:alpine-2.9.7@sha256:0a8753f9da5aafa65988f56af167700c055708a040df8bf154ce8ebe8e4adc75"
        --custom-platform linux/amd64 --no-push

  image-build-arm64:
    image: martizih/kaniko:v1.28.5-alpine@sha256:6ba327d49f75147a44e39e8a977e9cde11b483832214b307ccf11f9da360693c
    when:
      event: pull_request
    commands:
      - /kaniko/executor --context "$$CI_WORKSPACE" --dockerfile Dockerfile
        --build-arg "BUILDER=denoland/deno:alpine-2.9.7@sha256:0a8753f9da5aafa65988f56af167700c055708a040df8bf154ce8ebe8e4adc75"
        --custom-platform linux/arm64 --no-push

  # Guards against an accidental release: a `v*` tag publishes to JSR with the global token, so
  # this step fails the build unless the tagged commit is already on `main` (reviewed, green CI).
  # It is not access control: Woodpecker runs the tagged commit's own `.woodpecker.yml`, so a tag
  # on a branch that predates this step, or one that removes it, still publishes. A tag build's
  # clone is full but has no `main` ref, which is why the step fetches it.
  on-main:
    image: alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - git fetch --no-tags --depth=2147483647 origin main
      - git merge-base --is-ancestor "$${CI_COMMIT_SHA}" FETCH_HEAD || { echo "Refusing to publish, commit $${CI_COMMIT_SHA} is not on main"; exit 1; }

  # A `v*` tag also publishes the Docker image `antonshubin/caldav-mcp` to Docker Hub, in two steps.
  # Building and pushing are separate because kaniko runs the Dockerfile's RUN lines (`deno compile`
  # and every module it downloads) in its own container, where a login would be readable by all of
  # them. The `image-*` steps hold no secret and write one tar file per platform (amd64 for
  # servers, arm64 for a Raspberry Pi) to the workspace; `image-push` runs only crane, never
  # repository code, and is the one step that gets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (the
  # server's global secrets, enabled for the tag event). They run before the JSR publish, so a
  # Dockerfile that no longer builds stops the release before anything is out.
  image-amd64:
    image: martizih/kaniko:v1.28.5-alpine@sha256:6ba327d49f75147a44e39e8a977e9cde11b483832214b307ccf11f9da360693c
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      # --destination only names the image inside the tar; --no-push sends nothing anywhere.
      - /kaniko/executor --context "$$CI_WORKSPACE" --dockerfile Dockerfile
        --build-arg "BUILDER=denoland/deno:alpine-2.9.7@sha256:0a8753f9da5aafa65988f56af167700c055708a040df8bf154ce8ebe8e4adc75"
        --custom-platform linux/amd64
        --destination "antonshubin/caldav-mcp:$${CI_COMMIT_TAG#v}-amd64"
        --no-push --tar-path "$$CI_WORKSPACE/image-amd64.tar"

  image-arm64:
    image: martizih/kaniko:v1.28.5-alpine@sha256:6ba327d49f75147a44e39e8a977e9cde11b483832214b307ccf11f9da360693c
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - /kaniko/executor --context "$$CI_WORKSPACE" --dockerfile Dockerfile
        --build-arg "BUILDER=denoland/deno:alpine-2.9.7@sha256:0a8753f9da5aafa65988f56af167700c055708a040df8bf154ce8ebe8e4adc75"
        --custom-platform linux/arm64
        --destination "antonshubin/caldav-mcp:$${CI_COMMIT_TAG#v}-arm64"
        --no-push --tar-path "$$CI_WORKSPACE/image-arm64.tar"

  # Publishes to JSR (`jsr:@spy4x/caldav-mcp`) on a `v*` tag, after `check` passed. The tag must
  # match `version` in deno.jsonc. `$$` stops Woodpecker substituting the variable itself.
  publish:
    image: denoland/deno:2.9.7@sha256:fa335acdf6b72106eda2cb6a8cb5f4187e7630e357467489db4b2e7352d5e432
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      JSR_TOKEN:
        from_secret: JSR_TOKEN
    commands:
      - test "$${CI_COMMIT_TAG#v}" = "$(deno eval 'import { parse } from "jsr:@std/jsonc@1"; console.log(parse(Deno.readTextFileSync("deno.jsonc")).version)')"
      # A stalled upload is retried (#53): each attempt gets 10 minutes, and a version already
      # on JSR is skipped, so a retry publishes only what is missing. Each attempt logs its start,
      # end and exit code, so a stall shows whether the time went to the upload or to JSR.
      - |
        for attempt in 1 2 3; do
          echo "publish attempt $${attempt} started $$(date -u +%H:%M:%S)"
          rc=0
          timeout 600 deno publish --token "$${JSR_TOKEN}" || rc=$$?
          echo "publish attempt $${attempt} ended $$(date -u +%H:%M:%S), exit code $${rc}"
          if [ "$${rc}" -eq 0 ]; then exit 0; fi
        done
        exit 1

  # Pushes both tars to Docker Hub as `antonshubin/caldav-mcp:<version>-amd64` and `-arm64`, then
  # joins them into one multi-platform `antonshubin/caldav-mcp:<version>` (the tag without its `v`),
  # so `docker pull` picks the host's platform, and moves `latest` to it. crane's debug build, because the release builds
  # have no shell; its shell is /busybox/sh and it has no /bin/sh, so the entrypoint is named here.
  # The image name and tags come from this file and CI_COMMIT_TAG, never from the workspace, which
  # the build step could write to. The login stays in this container, outside the workspace.
  image-push:
    image: gcr.io/go-containerregistry/crane/debug:v0.22.1@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    entrypoint: ["/busybox/sh", "-c", "echo $$CI_SCRIPT | /busybox/base64 -d | /busybox/sh -e"]
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      DOCKERHUB_USERNAME:
        from_secret: DOCKERHUB_USERNAME
      DOCKERHUB_TOKEN:
        from_secret: DOCKERHUB_TOKEN
    commands:
      - |
          set -eu
          IMAGE=antonshubin/caldav-mcp
          VERSION="$${CI_COMMIT_TAG#v}"
          export DOCKER_CONFIG=/tmp/docker
          printf '%s' "$$DOCKERHUB_TOKEN" |
            crane auth login index.docker.io -u "$$DOCKERHUB_USERNAME" --password-stdin
          crane push image-amd64.tar "$$IMAGE:$$VERSION-amd64"
          crane push image-arm64.tar "$$IMAGE:$$VERSION-arm64"
          crane index append --docker-empty-base \
            -m "$$IMAGE:$$VERSION-amd64" -m "$$IMAGE:$$VERSION-arm64" -t "$$IMAGE:$$VERSION"
          # A pre-release tag (v1.2.3-rc.1) is published under its own name only; it never moves
          # latest.
          case "$$VERSION" in
            *-*) ;;
            *) crane tag "$$IMAGE:$$VERSION" latest ;;
          esac
