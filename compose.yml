# ── Homelab deployment ──
services:
  caldav-mcp:
    build: .
    container_name: caldav-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CALDAV_URL=${CALDAV_URL}
      - CALDAV_USERNAME=${CALDAV_USERNAME}
      - CALDAV_PASSWORD=${CALDAV_PASSWORD}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
      - PUBLIC_URL=${PUBLIC_URL}
      - OWNER_PASSWORD_HASH=${OWNER_PASSWORD_HASH}
      - AUTH_PEPPER=${AUTH_PEPPER}
      - ALLOW_BEARER_TOKEN_WITH_OAUTH=${ALLOW_BEARER_TOKEN_WITH_OAUTH:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - CALDAV_MCP_TIME_ZONE=${CALDAV_MCP_TIME_ZONE:-}
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    volumes:
      # OAuth grants and tokens (/data/oauth.kv), so a restart keeps connectors signed in.
      - caldav-mcp-data:/data
    mem_limit: 128M
    cpus: 0.25
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  caldav-mcp-data:
